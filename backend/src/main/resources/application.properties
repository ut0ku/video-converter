spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/video_converter}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
app.admin-password=${ADMIN_PASSWORD:12345}
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
converter.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
converter.storage-dir=${CONVERTER_STORAGE_DIR:${java.io.tmpdir}/video-converter}
converter.max-concurrent-jobs=${CONVERTER_MAX_CONCURRENT_JOBS:2}
app.jwt-secret=${JWT_SECRET:change-this-development-secret-to-a-256-bit-value}
app.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin-email=${ADMIN_EMAIL:admin@example.com}
app.admin-password=${ADMIN_PASSWORD:admin123}
